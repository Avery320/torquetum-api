[package]
name = "torquetum-api"
description = "Torquetum local API transport"
version = "0.0.0"
license = "MIT"
edition = "2024"
rust-version = "1.91.1"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
getrandom = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = "0.3.31"
tokio = { version = "1.47.1", features = ["io-util", "net", "rt", "test-util"] }
tokio-tungstenite = "0.29.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
